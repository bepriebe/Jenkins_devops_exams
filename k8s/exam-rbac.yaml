kind: RoleBinding
metadata:
  name: jenkins-exam-deployer
  namespace: jenkins-exam-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-exam-deployer
subjects:
