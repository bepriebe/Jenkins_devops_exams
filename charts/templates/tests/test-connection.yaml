apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "fastapiapp.fullname" . }}-test-connection"
  labels:
    {{- include "fastapiapp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['-qO-', '{{ include "fastapiapp.serviceName" (dict "root" . "name" "cast") }}:8000/api/v1/casts/openapi.json']
  restartPolicy: Never
