{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastapiapp.serviceName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "fastapiapp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $service.replicaCount }}
  selector:
    matchLabels:
      {{- include "fastapiapp.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "fastapiapp.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        environment: {{ $.Values.environment | quote }}
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fastapiapp.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: "{{ $service.repository }}:{{ $service.tag }}"
          imagePullPolicy: {{ $service.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
              protocol: TCP
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "fastapiapp.databaseSecretName" (dict "root" $ "name" $service.database) }}
                  key: DATABASE_URI
            {{- range $key, $value := $service.env }}
            - name: {{ $key }}
              value: {{ if eq $key "CAST_SERVICE_HOST_URL" }}{{ printf "http://%s:8000/api/v1/casts/" (include "fastapiapp.serviceName" (dict "root" $ "name" "cast")) | quote }}{{ else }}{{ $value | quote }}{{ end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ $service.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ $service.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
{{- end }}
